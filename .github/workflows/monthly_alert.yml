name: Monthly Nifty Midcap Alert

on:
  schedule:
    - cron: '30 2 1 * *'  # 8:00 AM IST (UTC+5:30)
  workflow_dispatch:       # manual trigger

jobs:
  run-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify required secrets exist
        run: |
          if [ -z "${{ secrets.TELEGRAM_TOKEN }}" ] || [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "ERROR: TELEGRAM_TOKEN and TELEGRAM_CHAT_ID must be set as repository secrets."
            exit 1
          fi

      - name: Run alert script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python cloud_holdings_alert.py
